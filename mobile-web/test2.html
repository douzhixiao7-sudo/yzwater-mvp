<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路线二维码生成 · 高德地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(145deg, #2b3a4d 0%, #1d2a36 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            background: #ff6a00;
            color: white;
            font-size: 1rem;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: 400;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 1.1rem;
            border-left: 4px solid #ff6a00;
            padding-left: 16px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .input-group:focus-within {
            border-color: #ff6a00;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(255, 106, 0, 0.2);
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            padding: 8px 0;
            outline: none;
            color: #1e293b;
            font-weight: 500;
        }

        .input-group input::placeholder {
            color: #94a3b8;
            font-weight: 300;
        }

        .coordinate-hint {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }

        .coordinate-hint button {
            background: none;
            border: none;
            color: #ff6a00;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
            padding: 0;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 80px;
            padding: 14px 10px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: #ff6a00;
            border-color: #ff6a00;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(255, 106, 0, 0.3);
        }

        .mode-btn:hover:not(.active) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .qrcode-section {
            background: white;
            border-radius: 40px;
            padding: 30px;
            margin: 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px dashed #cbd5e1;
        }

        .qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            position: relative;
        }

        #qrcode {
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode canvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .qrcode-tip {
            color: #64748b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 12px 25px;
            border-radius: 50px;
        }

        .qrcode-tip svg {
            width: 20px;
            height: 20px;
            fill: #ff6a00;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: #ff6a00;
            color: white;
            box-shadow: 0 15px 30px -10px rgba(255, 106, 0, 0.4);
        }

        .btn-primary:hover {
            background: #e55e00;
            transform: translateY(-2px);
            box-shadow: 0 20px 35px -10px rgba(255, 106, 0, 0.5);
        }

        .btn-secondary {
            background: #1e293b;
            color: white;
        }

        .btn-secondary:hover {
            background: #0f172a;
            transform: translateY(-2px);
        }

        .example-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .example-item {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .example-item:hover {
            background: #e2e8f0;
            border-color: #ff6a00;
        }

        .url-preview {
            background: #1e293b;
            color: #a5f3fc;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 20px;
            word-break: break-all;
            display: none;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .mode-selector {
                flex-wrap: wrap;
            }
            
            .mode-btn {
                min-width: calc(50% - 6px);
            }
            
            #qrcode {
                width: 200px;
                height: 200px;
            }
        }
    </style>
    <!-- 引入二维码生成库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>
            🗺️ 路线二维码生成器
            <span>高德地图</span>
        </h1>
        <div class="subtitle">
            输入起点和终点，生成二维码，手机扫描直接打开高德APP规划路线
        </div>

        <!-- 输入区域 -->
        <div class="input-grid">
            <div class="input-group">
                <label>🚩 起点 (经度,纬度)</label>
                <input type="text" id="start" value="116.3975,39.9087" placeholder="例如: 116.3975,39.9087">
                <div class="coordinate-hint">
                    <span>格式: 经度,纬度</span>
                    <button onclick="useExample('start', '天安门')">使用示例</button>
                </div>
            </div>

            <div class="input-group">
                <label>🏁 终点 (经度,纬度)</label>
                <input type="text" id="end" value="116.4136,39.9145" placeholder="例如: 116.4136,39.9145">
                <div class="coordinate-hint">
                    <span>格式: 经度,纬度</span>
                    <button onclick="useExample('end', '王府井')">使用示例</button>
                </div>
            </div>
        </div>

        <!-- 地点名称输入 -->
        <div class="input-grid">
            <div class="input-group">
                <label>📍 起点名称</label>
                <input type="text" id="startName" value="天安门" placeholder="例如: 天安门">
            </div>

            <div class="input-group">
                <label>📍 终点名称</label>
                <input type="text" id="endName" value="王府井" placeholder="例如: 王府井">
            </div>
        </div>

        <!-- 出行方式选择 -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="car">
                <span>🚗</span> 驾车
            </button>
            <button class="mode-btn" data-mode="bus">
                <span>🚌</span> 公交
            </button>
            <button class="mode-btn" data-mode="walk">
                <span>🚶</span> 步行
            </button>
            <button class="mode-btn" data-mode="ride">
                <span>🚲</span> 骑行
            </button>
        </div>

        <!-- 二维码展示区域 -->
        <div class="qrcode-section">
            <div class="qrcode-container">
                <div id="qrcode">
                    <!-- 二维码会在这里生成 -->
                </div>
            </div>
            <div class="qrcode-tip">
                <svg viewBox="0 0 24 24">
                    <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
                </svg>
                手机扫描二维码，自动打开高德地图APP规划路线
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="generateQRCode()">
                <span>🔄</span> 生成二维码
            </button>
            <button class="btn btn-secondary" onclick="openInBrowser()">
                <span>🌐</span> 在浏览器中打开
            </button>
        </div>

        <!-- 常用地点示例 -->
        <div style="margin-top: 25px;">
            <div style="color: #475569; margin-bottom: 10px; font-weight: 600;">📋 常用地点：</div>
            <div class="example-list">
                <div class="example-item" onclick="setExample('天安门', '116.3975,39.9087', '王府井', '116.4136,39.9145')">
                    天安门 → 王府井
                </div>
                <div class="example-item" onclick="setExample('故宫', '116.3970,39.9180', '北京南站', '116.3855,39.8711')">
                    故宫 → 北京南站
                </div>
                <div class="example-item" onclick="setExample('首都机场', '116.6036,40.0819', '鸟巢', '116.4024,39.9915')">
                    首都机场 → 鸟巢
                </div>
                <div class="example-item" onclick="setExample('上海外滩', '121.4905,31.2417', '东方明珠', '121.5064,31.2458')">
                    外滩 → 东方明珠
                </div>
            </div>
        </div>

        <!-- URL预览（调试用） -->
        <div class="url-preview" id="urlPreview"></div>
    </div>

    <script>
        let currentMode = 'car';

        // 出行方式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                generateQRCode(); // 切换模式时自动更新二维码
            });
        });

        // 验证坐标格式
        function validateCoordinate(coord) {
            const pattern = /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/;
            return pattern.test(coord);
        }

        // 构建高德地图URL
        function buildAmapUrl() {
            const start = document.getElementById('start').value.trim();
            const end = document.getElementById('end').value.trim();
            const startName = document.getElementById('startName').value.trim() || '起点';
            const endName = document.getElementById('endName').value.trim() || '终点';

            if (!validateCoordinate(start) || !validateCoordinate(end)) {
                alert('请输入正确的坐标格式！\n示例：116.3975,39.9087');
                return null;
            }

            const [startLng, startLat] = start.split(',').map(Number);
            const [endLng, endLat] = end.split(',').map(Number);

            // 构建高德地图URI导航链接 - 使用标准的amap URI scheme
            // 这种格式在手机端能直接唤起高德APP
            const url = `https://uri.amap.com/navigation?from=${startLng},${startLat},${encodeURIComponent(startName)}&to=${endLng},${endLat},${encodeURIComponent(endName)}&mode=${currentMode}&src=qr_generator&callnative=1`;
            
            // 预览URL（调试用）
            document.getElementById('urlPreview').style.display = 'block';
            document.getElementById('urlPreview').textContent = url;
            
            return url;
        }

        // 生成二维码
        function generateQRCode() {
            const url = buildAmapUrl();
            if (!url) return;

            // 清空二维码容器
            document.getElementById('qrcode').innerHTML = '';

            // 生成二维码
            QRCode.toCanvas(document.createElement('canvas'), url, {
                width: 250,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, function(error, canvas) {
                if (error) {
                    console.error(error);
                    document.getElementById('qrcode').innerHTML = '<p style="color:red">二维码生成失败</p>';
                    return;
                }
                document.getElementById('qrcode').appendChild(canvas);
                
                // 添加点击保存功能
                canvas.style.cursor = 'pointer';
                canvas.title = '点击保存二维码';
                canvas.onclick = function() {
                    const link = document.createElement('a');
                    link.download = `路线_${document.getElementById('startName').value}_到_${document.getElementById('endName').value}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                };
            });
        }

        // 在浏览器中打开（用于测试）
        function openInBrowser() {
            const url = buildAmapUrl();
            if (url) {
                window.open(url, '_blank');
            }
        }

        // 设置示例地点
        function setExample(startName, startCoord, endName, endCoord) {
            document.getElementById('startName').value = startName;
            document.getElementById('start').value = startCoord;
            document.getElementById('endName').value = endName;
            document.getElementById('end').value = endCoord;
            generateQRCode();
        }

        // 使用示例（辅助函数）
        function useExample(type, name) {
            const examples = {
                '天安门': '116.3975,39.9087',
                '王府井': '116.4136,39.9145',
                '故宫': '116.3970,39.9180',
                '北京南站': '116.3855,39.8711',
                '首都机场': '116.6036,40.0819',
                '鸟巢': '116.4024,39.9915'
            };
            
            if (type === 'start' && examples[name]) {
                document.getElementById('start').value = examples[name];
            } else if (type === 'end' && examples[name]) {
                document.getElementById('end').value = examples[name];
            }
            generateQRCode();
        }

        // 页面加载完成后自动生成二维码
        window.onload = function() {
            generateQRCode();
            
            // 监听输入变化，实时更新（可选，为了性能考虑，使用防抖）
            const inputs = ['start', 'end', 'startName', 'endName'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', debounce(generateQRCode, 500));
            });
        };

        // 简单的防抖函数
        function debounce(func, wait) {
            let timeout;
            return function() {
                clearTimeout(timeout);
                timeout = setTimeout(func, wait);
            };
        }
    </script>
</body>
</html>
