<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路线二维码生成 · 高德地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(145deg, #2b3a4d 0%, #1d2a36 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            background: #ff6a00;
            color: white;
            font-size: 1rem;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: 400;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 1.1rem;
            border-left: 4px solid #ff6a00;
            padding-left: 16px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .input-group:focus-within {
            border-color: #ff6a00;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(255, 106, 0, 0.2);
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            padding: 8px 0;
            outline: none;
            color: #1e293b;
            font-weight: 500;
        }

        .input-group input::placeholder {
            color: #94a3b8;
            font-weight: 300;
        }

        .coordinate-hint {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }

        .coordinate-hint button {
            background: none;
            border: none;
            color: #ff6a00;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
            padding: 0;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 80px;
            padding: 14px 10px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: #ff6a00;
            border-color: #ff6a00;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(255, 106, 0, 0.3);
        }

        .mode-btn:hover:not(.active) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .qrcode-section {
            background: white;
            border-radius: 40px;
            padding: 30px;
            margin: 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px dashed #cbd5e1;
        }

        .qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            position: relative;
        }

        #qrcode {
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode canvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .qrcode-tip {
            color: #64748b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 12px 25px;
            border-radius: 50px;
        }

        .qrcode-tip svg {
            width: 20px;
            height: 20px;
            fill: #ff6a00;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: #ff6a00;
            color: white;
            box-shadow: 0 15px 30px -10px rgba(255, 106, 0, 0.4);
        }

        .btn-primary:hover {
            background: #e55e00;
            transform: translateY(-2px);
            box-shadow: 0 20px 35px -10px rgba(255, 106, 0, 0.5);
        }

        .btn-secondary {
            background: #1e293b;
            color: white;
        }

        .btn-secondary:hover {
            background: #0f172a;
            transform: translateY(-2px);
        }

        .example-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .example-item {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .example-item:hover {
            background: #e2e8f0;
            border-color: #ff6a00;
        }

        .url-preview {
            background: #1e293b;
            color: #a5f3fc;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 20px;
            word-break: break-all;
            display: none;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .mode-selector {
                flex-wrap: wrap;
            }
            
            .mode-btn {
                min-width: calc(50% - 6px);
            }
            
            #qrcode {
                width: 200px;
                height: 200px;
            }
        }
    </style>
    <!-- 引入二维码生成库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>
            🗺️ 路线二维码生成器
            <span>高德地图</span>
        </h1>
        <div class="subtitle">
            输入起点和终点，生成二维码，手机扫描直接打开高德APP规划路线
        </div>

        <!-- 输入区域 -->
        <div class="input-grid">
            <div class="input-group">
                <label>🚩 起点 (经度,纬度)</label>
                <input type="text" id="start" value="116.3975,39.9087" placeholder="例如: 116.3975,39.9087">
                <div class="coordinate-hint">
                    <span>格式: 经度,纬度</span>
                    <button onclick="useExample('start', '天安门')">使用示例</button>
                    <button onclick="getCurrentLocation()">获取当前位置</button>
                </div>
            </div>

            <div class="input-group">
                <label>🏁 终点 (经度,纬度)</label>
                <input type="text" id="end" value="116.4136,39.9145" placeholder="例如: 116.4136,39.9145">
                <div class="coordinate-hint">
                    <span>格式: 经度,纬度</span>
                    <button onclick="useExample('end', '王府井')">使用示例</button>
                </div>
            </div>
        </div>

        <!-- 地点名称输入 -->
        <div class="input-grid">
            <div class="input-group">
                <label>📍 起点名称</label>
                <input type="text" id="startName" value="天安门" placeholder="例如: 天安门">
            </div>

            <div class="input-group">
                <label>📍 终点名称</label>
                <input type="text" id="endName" value="王府井" placeholder="例如: 王府井">
            </div>
        </div>

        <!-- 出行方式选择 -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="car">
                <span>🚗</span> 驾车
            </button>
            <button class="mode-btn" data-mode="bus">
                <span>🚌</span> 公交
            </button>
            <button class="mode-btn" data-mode="walk">
                <span>🚶</span> 步行
            </button>
            <button class="mode-btn" data-mode="ride">
                <span>🚲</span> 骑行
            </button>
        </div>

        <!-- 二维码展示区域 -->
        <div class="qrcode-section">
            <div class="qrcode-container">
                <div id="qrcode">
                    <!-- 二维码会在这里生成 -->
                </div>
            </div>
            <div class="qrcode-tip">
                <svg viewBox="0 0 24 24">
                    <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
                </svg>
                手机扫描二维码，自动打开高德地图APP规划路线
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="generateQRCode()">
                <span>🔄</span> 生成二维码
            </button>
            <button class="btn btn-secondary" onclick="openInBrowser()">
                <span>🌐</span> 在浏览器中打开
            </button>
        </div>

        <!-- 常用地点示例 -->
        <div style="margin-top: 25px;">
            <div style="color: #475569; margin-bottom: 10px; font-weight: 600;">📋 常用地点：</div>
            <div class="example-list">
                <div class="example-item" onclick="setExample('天安门', '116.3975,39.9087', '王府井', '116.4136,39.9145')">
                    天安门 → 王府井
                </div>
                <div class="example-item" onclick="setExample('故宫', '116.3970,39.9180', '北京南站', '116.3855,39.8711')">
                    故宫 → 北京南站
                </div>
                <div class="example-item" onclick="setExample('首都机场', '116.6036,40.0819', '鸟巢', '116.4024,39.9915')">
                    首都机场 → 鸟巢
                </div>
                <div class="example-item" onclick="setExample('上海外滩', '121.4905,31.2417', '东方明珠', '121.5064,31.2458')">
                    外滩 → 东方明珠
                </div>
            </div>
        </div>

        <!-- URL预览（调试用） -->
        <div class="url-preview" id="urlPreview"></div>
    </div>

    <script>
        let currentMode = 'car';
        // 高德逆地理编码key（硬编码）
        function getAmapKey() {
            return '29bcf1ba579a6d1d0783e4b467171447';
        }

        // ---------------------------
        // WGS84 -> GCJ-02（高德坐标系）
        // 参考常用实现：仅中国境内有效
        // ---------------------------
        const PI = Math.PI;
        const A = 6378245.0; // 长半轴
        const EE = 0.00669342162296594323; // 偏心率平方

        function outOfChina(lng, lat) {
            return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
        }

        function transformLat(x, y) {
            let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
            return ret;
        }

        function transformLng(x, y) {
            let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
            return ret;
        }

        function transformWGS84ToGCJ02(wgsLng, wgsLat) {
            const lng = Number(wgsLng);
            const lat = Number(wgsLat);
            if (!Number.isFinite(lng) || !Number.isFinite(lat)) return [wgsLng, wgsLat];
            if (outOfChina(lng, lat)) return [lng, lat];

            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * PI;
            let magic = Math.sin(radLat);
            magic = 1 - EE * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
            dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
            const mgLat = lat + dLat;
            const mgLng = lng + dLng;
            return [mgLng, mgLat];
        }

        // 去除“省/市”前缀信息（尽量保留详细地址）
        function removeProvinceCity(address) {
            if (!address) return '';
            let s = String(address);
            // 常见格式：xx省xx市xx区/县... 或 xx市xx区...
            // 先去掉省级
            s = s.replace(/^.*?省/, '');
            // 再去掉市级（注意直辖市/特别行政区也做一次弱处理）
            s = s.replace(/^.*?市/, '');
            s = s.replace(/^.*?(自治区|特别行政区)/, '');
            return s.trim();
        }

        /**
         * 根据经纬度获取地址信息（使用高德逆地理编码API）
         * @param {number} longitude - 经度（GCJ-02坐标系）
         * @param {number} latitude - 纬度（GCJ-02坐标系）
         * @returns {Promise<string>} 返回地址字符串
         */
        async function getAddressFromCoordinates(longitude, latitude) {
            try {
                const amapKey = getAmapKey();
                if (!amapKey) {
                    return `${Number(longitude).toFixed(6)}, ${Number(latitude).toFixed(6)}`;
                }

                const location = `${Number(longitude).toFixed(6)},${Number(latitude).toFixed(6)}`;
                const url = `https://restapi.amap.com/v3/geocode/regeo?key=${encodeURIComponent(amapKey)}&location=${encodeURIComponent(location)}&output=json&radius=1000&extensions=all`;

                const response = await fetch(url);
                const data = await response.json();

                if (data && data.status === '1' && data.regeocode && data.regeocode.formatted_address) {
                    const addr = removeProvinceCity(data.regeocode.formatted_address);
                    return addr || data.regeocode.formatted_address;
                }

                return `${Number(longitude).toFixed(6)}, ${Number(latitude).toFixed(6)}`;
            } catch (error) {
                return `${Number(longitude).toFixed(6)}, ${Number(latitude).toFixed(6)}`;
            }
        }

        /**
         * 获取当前位置（使用浏览器原生定位 + 高德逆地理编码）
         * @returns {Promise<Object>} 返回位置信息 { longitude, latitude, address, accuracy, timestamp }
         */
        async function getCurrentLocationByAmap() {
            // 检查浏览器是否支持定位
            if (!navigator.geolocation) {
                throw new Error('您的浏览器不支持定位功能');
            }

            // 获取当前位置（WGS84坐标系）
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(pos),
                    (err) => {
                        let errorMsg = '获取位置失败';
                        if (err && err.code === 1) {
                            errorMsg = '用户拒绝了定位请求';
                        } else if (err && err.code === 2) {
                            errorMsg = '位置信息不可用';
                        } else if (err && err.code === 3) {
                            errorMsg = '获取位置超时';
                        }
                        reject(new Error(errorMsg));
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });

            const wgs84Lng = Number(position.coords.longitude);
            const wgs84Lat = Number(position.coords.latitude);
            if (!Number.isFinite(wgs84Lng) || !Number.isFinite(wgs84Lat)) {
                throw new Error('定位成功但坐标无效');
            }

            // 将 WGS84 坐标转换为 GCJ-02 坐标（高德地图使用 GCJ-02）
            const [gcjLng, gcjLat] = transformWGS84ToGCJ02(wgs84Lng, wgs84Lat);

            // 使用高德逆地理编码API获取地址（如果没配置 key，会回落为经纬度字符串）
            const address = await getAddressFromCoordinates(gcjLng, gcjLat);

            return {
                longitude: wgs84Lng,
                latitude: wgs84Lat,
                gcj02Longitude: gcjLng,
                gcj02Latitude: gcjLat,
                address,
                accuracy: position.coords.accuracy || null,
                timestamp: new Date().toISOString()
            };
        }

        // 出行方式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                generateQRCode(); // 切换模式时自动更新二维码
            });
        });

        // 验证坐标格式
        function validateCoordinate(coord) {
            const pattern = /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/;
            return pattern.test(coord);
        }

        // 构建高德地图URL
        function buildAmapUrl() {
            const start = document.getElementById('start').value.trim();
            const end = document.getElementById('end').value.trim();
            const startName = document.getElementById('startName').value.trim() || '起点';
            const endName = document.getElementById('endName').value.trim() || '终点';

            if (!validateCoordinate(start) || !validateCoordinate(end)) {
                alert('请输入正确的坐标格式！\n示例：116.3975,39.9087');
                return null;
            }

            const [startLng, startLat] = start.split(',').map(Number);
            const [endLng, endLat] = end.split(',').map(Number);

            // 构建高德地图URI导航链接 - 使用标准的amap URI scheme
            // 这种格式在手机端能直接唤起高德APP
            const url = `https://uri.amap.com/navigation?from=${startLng},${startLat},${encodeURIComponent(startName)}&to=${endLng},${endLat},${encodeURIComponent(endName)}&mode=${currentMode}&src=qr_generator&callnative=1`;
            
            // 预览URL（调试用）
            document.getElementById('urlPreview').style.display = 'block';
            document.getElementById('urlPreview').textContent = url;
            
            return url;
        }

        // 生成二维码
        function generateQRCode() {
            const url = buildAmapUrl();
            if (!url) return;

            // 清空二维码容器
            document.getElementById('qrcode').innerHTML = '';

            // 生成二维码
            QRCode.toCanvas(document.createElement('canvas'), url, {
                width: 250,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, function(error, canvas) {
                if (error) {
                    console.error(error);
                    document.getElementById('qrcode').innerHTML = '<p style="color:red">二维码生成失败</p>';
                    return;
                }
                document.getElementById('qrcode').appendChild(canvas);
                
                // 添加点击保存功能
                canvas.style.cursor = 'pointer';
                canvas.title = '点击保存二维码';
                canvas.onclick = function() {
                    const link = document.createElement('a');
                    link.download = `路线_${document.getElementById('startName').value}_到_${document.getElementById('endName').value}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                };
            });
        }

        // 在浏览器中打开（用于测试）
        function openInBrowser() {
            const url = buildAmapUrl();
            if (url) {
                window.open(url, '_blank');
            }
        }

        // 设置示例地点
        function setExample(startName, startCoord, endName, endCoord) {
            document.getElementById('startName').value = startName;
            document.getElementById('start').value = startCoord;
            document.getElementById('endName').value = endName;
            document.getElementById('end').value = endCoord;
            generateQRCode();
        }

        // 使用示例（辅助函数）
        function useExample(type, name) {
            const examples = {
                '天安门': '116.3975,39.9087',
                '王府井': '116.4136,39.9145',
                '故宫': '116.3970,39.9180',
                '北京南站': '116.3855,39.8711',
                '首都机场': '116.6036,40.0819',
                '鸟巢': '116.4024,39.9915'
            };
            
            if (type === 'start' && examples[name]) {
                document.getElementById('start').value = examples[name];
            } else if (type === 'end' && examples[name]) {
                document.getElementById('end').value = examples[name];
            }
            generateQRCode();
        }

        // 获取当前位置（浏览器定位 + 高德逆编码）并填充为起点（demo）
        async function getCurrentLocation() {
            const startInput = document.getElementById('start');
            const startNameInput = document.getElementById('startName');

            try {
                const info = await getCurrentLocationByAmap();
                // 起点坐标：用 WGS84（手机定位原始坐标）展示；二维码本身支持任何经纬度，但建议和高德一致时改为 gcj02
                startInput.value = `${info.longitude.toFixed(6)},${info.latitude.toFixed(6)}`;
                startNameInput.value = info.address || '当前位置';
                generateQRCode();
            } catch (e) {
                console.error(e);
                // 兼容浏览器定位错误对象
                const msg = e && e.message ? e.message : '获取当前位置失败，请检查定位权限';
                alert(msg);
            }
        }

        // 页面加载完成后自动生成二维码
        window.onload = function() {
            generateQRCode();
            
            // 监听输入变化，实时更新（可选，为了性能考虑，使用防抖）
            const inputs = ['start', 'end', 'startName', 'endName'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', debounce(generateQRCode, 500));
            });
        };

        // 简单的防抖函数
        function debounce(func, wait) {
            let timeout;
            return function() {
                clearTimeout(timeout);
                timeout = setTimeout(func, wait);
            };
        }
    </script>
</body>
</html>
