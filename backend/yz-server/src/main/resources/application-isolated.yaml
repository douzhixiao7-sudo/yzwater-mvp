server:
  port: ${YZ_SERVER_PORT:48082}

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: ${YZ_DB_URL:jdbc:postgresql://127.0.0.1:5432/yzwater_isolated?stringtype=unspecified}
          username: ${YZ_DB_USERNAME:postgres}
          password: ${YZ_DB_PASSWORD:}
        slave:
          lazy: true
          url: ${YZ_DB_URL:jdbc:postgresql://127.0.0.1:5432/yzwater_isolated?stringtype=unspecified}
          username: ${YZ_DB_USERNAME:postgres}
          password: ${YZ_DB_PASSWORD:}
        xfhhMysql:
          lazy: true
          url: ${YZ_XFHH_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/yzwater_external?useSSL=false&serverTimezone=Asia/Shanghai}
          username: ${YZ_XFHH_MYSQL_USERNAME:root}
          password: ${YZ_XFHH_MYSQL_PASSWORD:}
  data:
    redis:
      host: ${YZ_REDIS_HOST:127.0.0.1}
      port: ${YZ_REDIS_PORT:6379}
      database: ${YZ_REDIS_DATABASE:8}
      password: ${YZ_REDIS_PASSWORD:}
  quartz:
    auto-startup: false

wx:
  mp:
    app-id: ${YZ_WX_MP_APP_ID:}
    secret: ${YZ_WX_MP_SECRET:}
  miniapp:
    appid: ${YZ_WX_MINIAPP_ID:}
    secret: ${YZ_WX_MINIAPP_SECRET:}

yz:
  security:
    mock-enable: false
  weather:
    enabled: false
    station-spider:
      enabled: false
    fy:
      enabled: false
  video:
    hk:
      enabled: false
      host: ${YZ_VIDEO_HK_HOST:}
      app-key: ${YZ_VIDEO_HK_APP_KEY:}
      app-secret: ${YZ_VIDEO_HK_APP_SECRET:}
  system:
    sso:
      user-center:
        enabled: false
        client-id: ${YZ_USERCENTER_CLIENT_ID:}
        client-secret: ${YZ_USERCENTER_CLIENT_SECRET:}
  api-encrypt:
    enable: false

justauth:
  enabled: false
